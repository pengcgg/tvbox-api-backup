name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 共用并发组，自动更新脚本完成后才执行发布，串行防乱序
concurrency:
  group: "tvbox-repo-write"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b082509a8c86d1853e870b420fbb4b
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56617c122f24317d087b487475f86a205c65d06e
        with:
          path: './web'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aeea44d9f8d26b054a83