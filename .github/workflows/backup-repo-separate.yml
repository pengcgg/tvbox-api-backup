name: Backup Repo | 独立仓库+自动清旧
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 保留多少份备份
        default: '7'
        type: number

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKUP_REPO: "pengcgg/backup-repo"
  TZ: Asia/Shanghai

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      RETENTION_COUNT: ${{ github.event.inputs.keep_count || 7 }}
    steps:
      - name: Checkout 源仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: 打包全部文件（排除 .git）
        run: |
          BACKUP_NAME="repo-backup_$(date '+%Y%m%d_%H%M%S').zip"
          zip -r "$BACKUP_NAME" . -x "./.git/*" "./.git"
          echo "BACKUP_FILE=$BACKUP_NAME" >> $GITHUB_ENV

      - name: 克隆备份仓库，清理旧包
        run: |
          git clone https://${{ secrets.xiaofu }}@github.com/${{ env.BACKUP_REPO }} backup-repo
          cd backup-repo
          cp ../${{ env.BACKUP_FILE }} ./
          ls -1 repo-backup_*.zip 2>/dev/null | sort | head -n -${{ env.RETENTION_COUNT }} | xargs -r rm -f
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "备份仓库无变更，跳过提交"
          else
            git commit -m "chore: 自动备份 ${{ env.BACKUP_FILE }}"
            git push
          fi