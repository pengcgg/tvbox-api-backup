name: 央视直播源自动刷新

on:
  schedule:
    - cron: "0 */6 * * *"     # UTC，北京 02/08/14/20 点
  workflow_dispatch:          # 也能手动点一下立即刷新

permissions:
  contents: read

concurrency:
  group: cctv-m3u-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 刷新鉴权并生成 m3u
        env:
          OUT: 央视直播_10台.m3u
          ALIAS_OUT: cctv10.m3u
          JOBS: "3"
        run: python cctv_live.py

      - name: 克隆目标仓库，上传 m3u 文件
        run: |
          # 克隆目标仓库
          git clone https://${{ secrets.xiaofu }}@github.com/${{ secrets.pengcgg/backup-repo }} target-repo
          cd target-repo
          # 复制生成好的两个m3u进去
          cp ../"央视直播_10台.m3u" ./
          cp ../cctv10.m3u ./

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "央视直播_10台.m3u" cctv10.m3u

          if git diff --cached --quiet; then
            echo "m3u内容无变化，跳过提交推送"
            exit 0
          fi
          git commit -m "chore: 央视源刷新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cctv-live-m3u
          path: |
            央视直播_10台.m3u
            cctv10.m3u